// Alias
alias "+quickcrowbar" "use weapon_crowbar;wait 20;+attack"
alias "-quickcrowbar" "wait 20;-attack;wait 50;lastinv"
alias "altzoom_off" "fov_desired 90;wait;sensitivity 3;wait;r_drawviewmodel 1;bind z altzoom_on"
alias "altzoom_on" "fov_desired 30;wait;sensitivity 1.5;wait;r_drawviewmodel 0;bind z altzoom_off"
alias "flashlight" "r_flashlightrender 1;ent_fire !player EnableFlashlight"
alias "givemp5" "give weapon_mp5; give item_grenade_mp5; give item_grenade_mp5; give item_grenade_mp5"
alias "hc" "give item_healthkit;give item_battery"
alias "highfl" "impulse 100;gb_flashlight_range 3250;gb_flashlight_intensity 4;gb_flashlight_phi 130;gb_flashlight_col 245 240 225"
alias "speed" "ent_fire env_global TurnOff;ent_create player_speedmod targetname plyspdmd spawnflags 0;ent_fire plyspdmd ModifySpeed 1.0;ent_fire !player EnableFlashlight" // Using player_speedmod will disable flashlight
alias "strip" "ent_create player_weaponstrip targetname wpnstrp;ent_fire wpnstrp StripWeaponsAndSuit"
alias "timescale_off" "host_timescale 1;alias timescale_toggle timescale_on"
alias "timescale_on" "host_timescale 10;alias timescale_toggle timescale_off"
alias "timescale_toggle" "timescale_on"
alias "weapons" "give weapon_357;give item_ammo_357;give weapon_mp5;give item_ammo_mp5;give item_grenade_mp5;give weapon_shotgun;give item_ammo_shotgun"

// Alias Keybinds
bind "SEMICOLON" "timescale_toggle"
bind "\" "exec custom"
bind "f" "highfl"
bind "m" "hc"
bind "x" "+quickcrowbar"
bind "y" "givemp5"
bind "z" "altzoom_on"

// Cheat Control
sv_cheats "1"
sv_noclipaccelerate "5"
sv_noclipspeed "5"

// Unlock chapters
sv_unlockedchapters "20"

// Display & Closed Caption
// Subscribing too many addons will cause subtitles not be shown!
cc_lang "korean"
cc_subtitles "1"
closecaption "1"
mat_monitorgamma "1.6"
mat_monitorgamma_tv_enabled "1"
save_console "1"

// Reduce overbright specular
gb_spot_SpecMul "0.3"

// Input
m_rawinput "1"
sensitivity "3"

// Audio
dsp_enhance_stereo "1"
dsp_volume "1.0"
snd_fxvolume "0.75"
snd_mixahead "0.1"
snd_musicvolume "0.75"
suitvolume "0.25"
volume "0.3"

// Misc
bm_gib_on_health_below "0"
mp_flashlight "1"
sk_autoaim_mode "1"
skill "1"

host_writeconfig
